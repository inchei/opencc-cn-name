name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify generated data matches name_cn.json (drift check)
        run: python3 scripts/gen.py

      - name: Python tests
        run: |
          cd python
          uv run --with opencc --with pytest python -m pytest -q

      - name: JS tests
        run: |
          cd js
          npm install
          npm run build
          node --test