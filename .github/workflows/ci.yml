name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify generated data matches name_cn.json (drift check)
        run: python3 scripts/gen.py

      - name: Python tests
        run: |
          cd python
          uv run --with opencc --with pytest python -m pytest -q

      - name: JS tests
        run: |
          cd js
          npm install
          npm run build
          node --test