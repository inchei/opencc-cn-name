name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify versions match tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./js/package.json').version")"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid version: $version (tags should look like vX.Y.Z)"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify npm version matches
        run: |
          node -e "const v = require('./js/package.json').version; if (v !== '${{ steps.version.outputs.version }}') { console.error('js/package.json=' + v); process.exit(1); }"

      - name: Verify Python version matches
        run: |
          python - '${{ steps.version.outputs.version }}' <<'PY'
          import sys, tomllib
          expected = sys.argv[1]
          v = tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"]
          if v != expected:
              raise SystemExit(f"python/pyproject.toml={v} != {expected}")
          PY

      - name: Verify generated data is up to date
        run: python3 scripts/gen.py

  npm:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Build
        run: npm run build
        working-directory: js

      - name: Test
        run: node --test
        working-directory: js

      - name: Publish (trusted publishing via OIDC)
        run: npm publish --provenance --access public
        working-directory: js

  pypi:
    name: Publish to PyPI
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build sdist + wheel
        run: python -m build
        working-directory: python

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist